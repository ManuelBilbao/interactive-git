<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The header's BrandMark, redrawn for 16px: the same two commits and a
       branch, with heavier strokes so the shape survives the size, and the
       dots spread wider apart so they stay three dots instead of one blob.
       The middle dot sits exactly on the elbow: that is the commit the
       branch starts from. -->
  <path
    d="M9 24V12.5a3.5 3.5 0 0 1 3.5-3.5H23"
    fill="none"
    stroke="#cf4f26"
    stroke-width="3"
    stroke-linecap="round"
  />
  <circle cx="9" cy="24" r="3.5" fill="#cf4f26" />
  <circle cx="9" cy="9" r="3.5" fill="#cf4f26" />
  <circle cx="23" cy="9" r="3.5" fill="#cf4f26" />
</svg>
